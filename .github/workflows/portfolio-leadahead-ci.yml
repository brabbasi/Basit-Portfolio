name: Portfolio LeadAhead Truthful Listing
on:
  pull_request:
    paths:
      - 'index.html'
      - 'style.css'
      - 'leadahead.html'
      - 'README.md'
      - '.github/workflows/portfolio-leadahead-ci.yml'
permissions:
  contents: read
jobs:
  offline-source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # reviewed v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check exact source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Validate portfolio links and truthful privacy claims
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag=="a":
                      self.hrefs.extend(v for k,v in attrs if k=="href")
          home=Path("index.html").read_text(encoding="utf-8")
          detail=Path("leadahead.html").read_text(encoding="utf-8")
          css=Path("style.css").read_text(encoding="utf-8")
          # Social preview cards must not advertise invented URLs or relative images.
          class SocialMetadata(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.properties = {}
              def handle_starttag(self, tag, attrs):
                  if tag == "meta":
                      values = dict(attrs)
                      prop = values.get("property", "")
                      if prop.startswith("og:"):
                          assert prop not in self.properties, "duplicate Open Graph property"
                          self.properties[prop] = values.get("content", "")
          social = SocialMetadata()
          social.feed(home)
          for prop in ("og:title", "og:description", "og:type"):
              assert social.properties.get(prop), "missing Open Graph metadata: " + prop
          assert social.properties["og:type"] == "website", "incorrect share card type"
          for prop in ("og:url", "og:image"):
              if prop in social.properties:
                  value = social.properties[prop].strip().lower()
                  assert value.startswith("https://") and not any(
                      bad in value for bad in ("your-", "placeholder", "localhost", "127.0.0.1")
                  ), "noncanonical share card target: " + prop
          assert "https://your-vercel-link.com" not in home, "invented deployment URL"
          assert ".fade-in {\n  opacity: 1;\n  transform: none;" in css, "sections hidden without IntersectionObserver"
          assert ".reveal-ready .fade-in:not(.appear)" in css, "enhanced scroll state missing"
          assert "@media (prefers-reduced-motion: no-preference)" in css, "reduced-motion gate missing"
          assert "typeof window.IntersectionObserver === 'function'" in home, "observer support gate missing"
          assert "document.documentElement.classList.add('reveal-ready')" in home, "enhancement not enabled"
          assert "document.documentElement.classList.remove('reveal-ready')" in home, "fallback not restored"
          assert "fader => observer.observe(fader)" in home, "sections not observed"
          parser=Links()
          parser.feed(home)
          assert parser.hrefs.count("leadahead.html")==1, "missing or duplicate project card"
          parser=Links()
          parser.feed(detail)
          assert "index.html#projects" in parser.hrefs
          for required in ("LeadAhead", "not a deployed product", "independent concept", "fictional or expressly authorized"):
              assert required.lower() in detail.lower(), required
          assert "submit" not in detail.lower() or "not" in detail.lower()
          assert "Fictional opening handoff" in detail, "missing distinct fictional demonstration"
          assert "Coverage gap: one position." in detail, "coverage arithmetic/example lost"
          assert "This example is static explanatory content" in detail, "demo wrongly claims real functionality"
          assert "a separate DRAFT engineering branch" in detail, "unproven deployment/readiness claim"
          assert "does not establish human acceptance, an operational pilot, employer integration, deployment or real-world use." in detail, "missing no-human-acceptance/no-deployment disclaimer"
          class HeadingParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.headings = []
              def handle_starttag(self, tag, attrs):
                  if tag in ("h1", "h2", "h3"):
                      self.headings.append(tag)
          headings = HeadingParser()
          headings.feed(detail)
          assert headings.headings == ["h1", "h2", "h3", "h3", "h3", "h2", "h2"], "incorrect detail heading hierarchy"
          assert "minmax(min(100%,235px),1fr)" in detail, "card grid must permit narrow widths"
          print("LEADAHEAD_HEADING_AND_REFLOW_SOURCE_CHECKS=PASS")
          print("LEADAHEAD_PORTFOLIO_SOURCE_AND_LINKS=PASS")
          print("PRODUCTION_PUBLICATION=NOT_AUTHORIZED")
          PY
